name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware compila (ESP32-C3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Usar o modelo de senhas
        run: cp firmware/DetectorDeGasComDashboard/secrets.example.h firmware/DetectorDeGasComDashboard/secrets.h
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar o núcleo ESP32 e a biblioteca PubSubClient
        env:
          ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_URL"
          arduino-cli lib install PubSubClient
      - name: Compilar
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 --warnings default firmware/DetectorDeGasComDashboard

  ferramentas:
    name: Ferramentas Python e simulação reproduzível
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Fortaleza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ferramentas/requirements.txt ruff
      - name: Erros de sintaxe e nomes indefinidos
        run: ruff check ferramentas --select E9,F63,F7,F82
      - name: Simulação gera o mesmo registro guardado em evidencias/
        run: |
          cd ferramentas
          python simular_ensaios.py > /dev/null
          cd ..
          git diff --exit-code -- evidencias/
