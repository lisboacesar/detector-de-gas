; Configuracao do coletor e do teste de seguranca.
; Copie este arquivo para config.ini e preencha. O config.ini NAO vai para o git.

[mqtt]
; Endereco do deployment (pagina Overview do EMQX Cloud)
host = z2d90268.ala.us-east-1.emqxsl.com
porta = 8883
tls = sim
; Certificado da autoridade (o mesmo baixado na pagina Overview)
ca = emqxsl-ca.crt
topico_base = detector-gas

; Usuario usado pelo coletor. Use o usuario "dashboard" (so leitura)
; ou crie um usuario "coletor" e bloqueie a publicacao dele tambem.
usuario = dashboard
senha = SENHA_DO_DASHBOARD

[banco]
arquivo = dados/detector.db

[teste_seguranca]
; Usuario que NAO deve conseguir publicar (o do dashboard)
usuario_leitura = dashboard
senha_leitura = SENHA_DO_DASHBOARD
